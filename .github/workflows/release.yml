name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "Tag version (${VERSION}) does not match VERSION file (${FILE_VERSION})" >&2
            exit 1
          fi
          OUT="linker_${VERSION}_${GOOS}_${GOARCH}${EXT}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${OUT}" ./cmd/linker
      - uses: actions/upload-artifact@v4
        with:
          name: linker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum linker_* > SHA256SUMS
          ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Cross-platform symlink manager for dotfiles (`linker.toml`).

            ## Binaries
            | Platform | Archive |
            |----------|---------|
            | Linux amd64 | `linker_*_linux_amd64` |
            | Linux arm64 | `linker_*_linux_arm64` |
            | macOS Intel | `linker_*_darwin_amd64` |
            | macOS Apple Silicon | `linker_*_darwin_arm64` |
            | Windows amd64 | `linker_*_windows_amd64.exe` |
            | Windows arm64 | `linker_*_windows_arm64.exe` |

            **Windows:** enable Developer Mode (or run elevated) to create symlinks.
